<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My solar – Surya Saathi</title>
<meta name="description" content="The app for your rooftop solar: live output, today's curve, the next three days, savings, dust and the day to clean, inverter events explained, and 25 years of care.">
<meta name="theme-color" content="#f4f7fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My solar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Mukta:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8.4.1/css/ionic.bundle.css">
<link rel="stylesheet" href="app.css">
<script>
  // On the website the app runs inside an iPhone frame, so it takes iOS styling whatever the browser is
  window.Ionic = { config: new URLSearchParams(location.search).has("embed") ? { mode: "ios" } : {} };
  // inside the website's iPhone frame there are no safe-area insets, so leave room for the island and home bar
  if (new URLSearchParams(location.search).has("embed")) {
    document.documentElement.classList.add("embed");
    document.documentElement.style.setProperty("--ion-safe-area-top", "50px");
    document.documentElement.style.setProperty("--ion-safe-area-bottom", "20px");
  }
</script>
<script src="../config.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8.4.1/dist/ionic/ionic.esm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<ion-app>
  <ion-tabs id="tabs">

    <!-- today -->
    <ion-tab tab="today">
      <div class="ion-page">
        <ion-header class="ion-no-border">
          <ion-toolbar>
            <ion-title><span class="t-title" data-t="appName"></span></ion-title>
            <ion-buttons slot="end"><ion-button id="open-settings" aria-label="Settings"><ion-icon slot="icon-only" name="options-outline"></ion-icon></ion-button></ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-refresher slot="fixed" class="refresher"><ion-refresher-content></ion-refresher-content></ion-refresher>
          <div class="wrap">
            <p class="site" id="site"></p>

            <section class="sky" id="sky" aria-live="polite">
              <svg class="arc" viewBox="0 0 320 150" aria-hidden="true">
                <path id="arc-path" class="arc-all" d="M20 140 A140 125 0 0 1 300 140"/>
                <path id="arc-done" class="arc-done" d="M20 140 A140 125 0 0 1 300 140"/>
                <g id="sun-mark"><circle class="glow" r="17"/><g class="pixsun" transform="translate(-9 -9)"><rect x="6" y="6" width="6" height="6"/><rect x="8" y="1" width="2" height="3"/><rect x="8" y="14" width="2" height="3"/><rect x="1" y="8" width="3" height="2"/><rect x="14" y="8" width="3" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="13" y="3" width="2" height="2"/><rect x="3" y="13" width="2" height="2"/><rect x="13" y="13" width="2" height="2"/></g></g>
              </svg>
              <div class="sky-read">
                <p class="sky-when" id="sky-when"></p>
                <p class="sky-big"><span id="sky-kw">0</span><small>kW</small></p>
                <p class="sky-status" id="sky-status"></p>
              </div>
              <p class="sky-times"><span id="sky-rise"></span><span id="sky-set"></span></p>
            </section>

            <section class="card alert" id="live-event" hidden></section>

            <section class="card flow-card">
              <h2 class="card-title" data-t="flowTitle"></h2>
              <svg class="roof flow" id="roof" viewBox="0 0 320 190" aria-hidden="true">
                <defs>
                  <linearGradient id="roof-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebfb"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
                  <linearGradient id="roof-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18264a"/><stop offset="1" stop-color="#34497a"/></linearGradient>
                  <linearGradient id="panel-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d5b9a"/><stop offset="1" stop-color="#17325c"/></linearGradient>
                  <linearGradient id="glint-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                  <pattern id="dust-pat" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#b48a55"/><circle cx="1.5" cy="2" r=".9" fill="#8a6435"/><circle cx="4.5" cy="4.6" r=".7" fill="#d6b27d"/></pattern>
                  <clipPath id="panel-clip"><polygon points="120.4,111.3 188.9,71.8 168.2,36.7 99.7,76.3"/></clipPath>
                  <clipPath id="scene-clip"><rect width="320" height="190" rx="18"/></clipPath>
                </defs>
                <g clip-path="url(#scene-clip)">
                  <rect class="sky-bg" width="320" height="190"/>
                  <g class="stars"><circle cx="40" cy="22" r="1"/><circle cx="96" cy="14" r=".8"/><circle cx="214" cy="20" r="1"/><circle cx="290" cy="38" r=".8"/><circle cx="250" cy="12" r=".7"/><circle cx="150" cy="10" r=".7"/></g>
                  <g class="sun" transform="translate(44 40)"><circle r="13"/><g class="rays"><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(0)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(45)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(90)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(135)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(180)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(225)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(270)"/><line x1="0" y1="-19" x2="0" y2="-25" transform="rotate(315)"/></g></g>
                  <path class="moon" d="M50 30a12 12 0 1 0 6 21 10 10 0 1 1-6-21z"/>
                  <ellipse class="ground" cx="160" cy="182" rx="190" ry="26"/>
                  <g class="tree"><rect x="27" y="140" width="4" height="24" rx="1"/><circle cx="29" cy="134" r="13"/><circle cx="20" cy="142" r="8"/><circle cx="38" cy="141" r="9"/></g>
                  <path class="wire" d="M197.7 76 Q226 90 254 81"/>
                  <path class="wire" d="M256 97 Q226 112 197 113"/>
                  <g class="node grid pylon"><path d="M260 176L266 72M282 176L274 72M266 72h8M262 140h18M263.5 112h15M265 92h11M262 140l14-28M280 140l-14-28M264 112l11-20M278 112l-11-20"/><path class="arm" d="M250 81h40M254 97h32"/></g>
                  <polygon class="r-back" points="64.3,89 144,43 170.8,28.5 91.2,74.5"/>
                  <polygon class="r-gable" points="64.3,89 118,120 91.2,74.5"/>
                  <polygon class="w-left" points="118,170 64.3,139 64.3,89 118,120"/>
                  <polygon class="w-right" points="118,170 197.7,124 197.7,74 118,120"/>
                  <polygon class="win" points="103,143.3 84.7,132.8 84.7,114.8 103,125.3"/>
                  <polygon class="win" points="167.4,124.5 184.9,114.4 184.9,96.4 167.4,106.5"/>
                  <polygon class="door" points="143.5,155.3 155.4,148.4 155.4,118.4 143.5,125.3"/>
                  <polygon class="r-front" points="118,120 197.7,74 170.8,28.5 91.2,74.5"/>
                  <g class="node solar panels"><polygon class="cell" points="120.4,111.3 136.7,101.9 126.8,85.1 110.4,94.5"/><polygon class="cell" points="109.6,93.1 125.9,83.7 116.0,66.9 99.7,76.3"/><polygon class="cell" points="137.7,101.3 154.1,91.9 144.1,75.0 127.8,84.5"/><polygon class="cell" points="127.0,83.1 143.3,73.7 133.4,56.8 117.1,66.3"/><polygon class="cell" points="155.1,91.3 171.4,81.8 161.5,65.0 145.2,74.4"/><polygon class="cell" points="144.4,73.1 160.7,63.6 150.8,46.8 134.4,56.2"/><polygon class="cell" points="172.5,81.2 188.8,71.8 178.9,55.0 162.5,64.4"/><polygon class="cell" points="161.7,63.0 178.1,53.6 168.1,36.8 151.8,46.2"/>
                    <g clip-path="url(#panel-clip)"><rect class="glint" x="60" y="20" width="40" height="110" fill="url(#glint-g)" transform="skewX(-20)"/></g>
                    <polygon class="dust" id="dust" points="120.4,111.3 188.9,71.8 168.2,36.7 99.7,76.3"/>
                  </g>
                  <g id="drops"></g>
                  <path id="p-sh" class="lane" d="M144.4 74.3C146 95 149 115 149.9 137.6"/>
                  <path id="p-sg" class="lane" d="M144.4 74.3L192 70Q224 88 254 81"/>
                  <path id="p-gh" class="lane" d="M256 97Q226 112 190 114"/>
                  <g id="dots"></g>
                </g>
              </svg>
              <div class="flow-legend">
                <p><b id="f-solar"></b><span data-t="fSolar"></span></p>
                <p><b id="f-home"></b><span data-t="fHome"></span></p>
                <p><b id="f-grid"></b><span id="f-grid-label"></span></p>
              </div>
            </section>

            <section class="card">
              <div class="card-head">
                <h2 class="card-title" data-t="todayTitle"></h2>
                <p class="hint" data-t="scrubHint"></p>
              </div>
              <div class="chart" id="chart-today" role="img"></div>
              <div class="legend">
                <span><i class="key k-sun"></i><span data-t="kYours"></span></span>
                <span><i class="key k-ahead"></i><span data-t="kAhead"></span></span>
                <span><i class="key k-clean"></i><span data-t="kClean"></span></span>
              </div>
              <div class="figs">
                <div><p class="fig" id="t-sofar"></p><p class="cap" data-t="cSoFar"></p></div>
                <div><p class="fig" id="t-saved"></p><p class="cap" data-t="cSaved"></p></div>
                <div><p class="fig" id="t-day"></p><p class="cap" data-t="cDay"></p></div>
              </div>
              <div class="split" id="t-split"></div>
            </section>

            <section class="card dust" id="dust-card"></section>

            <section class="card">
              <div class="card-head"><h2 class="card-title" data-t="eventsTitle"></h2><p class="hint" data-t="eventsSub"></p></div>
              <ion-list lines="inset" id="events" class="events"></ion-list>
            </section>

            <p class="foot" id="foot"></p>
          </div>
        </ion-content>
      </div>
    </ion-tab>

    <!-- forecast -->
    <ion-tab tab="ahead">
      <div class="ion-page">
        <ion-header class="ion-no-border"><ion-toolbar><ion-title data-t="tAhead"></ion-title></ion-toolbar></ion-header>
        <ion-content>
          <div class="wrap">
            <div class="days" id="days"></div>
            <section class="card">
              <div class="card-head"><h2 class="card-title" data-t="historyTitle"></h2><p class="hint" id="history-avg"></p></div>
              <div class="chart" id="chart-history" role="img"></div>
            </section>
            <p class="foot" data-t="aheadFoot"></p>
          </div>
        </ion-content>
      </div>
    </ion-tab>

    <!-- money -->
    <ion-tab tab="money">
      <div class="ion-page">
        <ion-header class="ion-no-border"><ion-toolbar><ion-title data-t="tMoney"></ion-title></ion-toolbar></ion-header>
        <ion-content>
          <div class="wrap">
            <section class="card month">
              <p class="eyebrow" data-t="monthTitle"></p>
              <p class="hero-fig" id="m-rs"></p>
              <p class="cap" id="m-kwh"></p>
              <div class="promise" id="promise"></div>
            </section>
            <section class="tiles" id="life"></section>
            <section class="card">
              <div class="card-head"><h2 class="card-title" data-t="yearsTitle"></h2><p class="hint" data-t="yearsSub"></p></div>
              <div class="chart" id="chart-years" role="img"></div>
              <p class="note" data-t="inverterNote"></p>
            </section>
          </div>
        </ion-content>
      </div>
    </ion-tab>

    <!-- care -->
    <ion-tab tab="care">
      <div class="ion-page">
        <ion-header class="ion-no-border"><ion-toolbar><ion-title data-t="tCare"></ion-title></ion-toolbar></ion-header>
        <ion-content>
          <div class="wrap">
            <section class="card clean" id="clean-card"></section>
            <section class="card clean" id="owed-card"></section>
            <section class="card">
              <h2 class="card-title" data-t="calTitle"></h2>
              <ion-list lines="inset" id="calendar" class="cal"></ion-list>
            </section>
            <section class="card">
              <h2 class="card-title" data-t="warrantyTitle"></h2>
              <div class="warranty" id="warranty"></div>
            </section>
            <section class="card">
              <h2 class="card-title" data-t="helpTitle"></h2>
              <ion-list lines="inset" class="help">
                <ion-item button detail href="../#support" target="_top"><ion-icon slot="start" name="chatbubbles-outline"></ion-icon><ion-label><span data-t="helpSupport"></span></ion-label></ion-item>
                <ion-item button detail href="../#firstbill" target="_top"><ion-icon slot="start" name="receipt-outline"></ion-icon><ion-label><span data-t="helpBill"></span></ion-label></ion-item>
                <ion-item button detail href="../#panel" target="_top"><ion-icon slot="start" name="scan-outline"></ion-icon><ion-label><span data-t="helpPanel"></span></ion-label></ion-item>
                <ion-item button detail id="open-connect"><ion-icon slot="start" name="link-outline"></ion-icon><ion-label><span data-t="helpConnect"></span></ion-label></ion-item>
              </ion-list>
            </section>
            <ion-button expand="block" fill="outline" class="install" id="install" hidden><ion-icon slot="start" name="download-outline"></ion-icon><span data-t="install"></span></ion-button>
          </div>
        </ion-content>
      </div>
    </ion-tab>

    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="today"><ion-icon name="sunny-outline"></ion-icon><ion-label><span data-t="tToday"></span></ion-label></ion-tab-button>
      <ion-tab-button tab="ahead"><ion-icon name="partly-sunny-outline"></ion-icon><ion-label><span data-t="tAhead"></span></ion-label></ion-tab-button>
      <ion-tab-button tab="money"><ion-icon name="wallet-outline"></ion-icon><ion-label><span data-t="tMoney"></span></ion-label></ion-tab-button>
      <ion-tab-button tab="care"><ion-icon name="construct-outline"></ion-icon><ion-label><span data-t="tCare"></span></ion-label></ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>

  <!-- an inverter event, explained -->
  <ion-modal id="event-sheet" initial-breakpoint="0.75" breakpoints="[0, 0.75, 1]">
    <div class="sheet" id="event-body"></div>
  </ion-modal>

  <!-- the home's system -->
  <ion-modal id="settings">
    <ion-header><ion-toolbar>
      <ion-buttons slot="start"><ion-button id="settings-cancel" data-t="cancel"></ion-button></ion-buttons>
      <ion-title data-t="settingsTitle"></ion-title>
      <ion-buttons slot="end"><ion-button id="settings-save" strong data-t="save"></ion-button></ion-buttons>
    </ion-toolbar></ion-header>
    <ion-content class="ion-padding settings">
      <ion-list inset>
        <ion-item><ion-input id="s-kw" type="number" inputmode="decimal" min="0.5" max="20" step="0.5" label-placement="stacked" data-label="sKw"></ion-input></ion-item>
        <ion-item><ion-input id="s-place" type="text" enterkeyhint="search" label-placement="stacked" data-label="sPlace"></ion-input></ion-item>
        <ion-item><ion-input id="s-installed" type="date" label-placement="stacked" data-label="sInstalled"></ion-input></ion-item>
        <ion-item><ion-input id="s-cleaned" type="date" label-placement="stacked" data-label="sCleaned"></ion-input></ion-item>
      </ion-list>
      <ion-list inset>
        <ion-item><ion-input id="s-use" type="number" inputmode="numeric" min="30" label-placement="stacked" data-label="sUse"></ion-input></ion-item>
        <ion-item><ion-input id="s-promised" type="number" inputmode="numeric" min="0" label-placement="stacked" data-label="sPromised"></ion-input></ion-item>
        <ion-item><ion-input id="s-rate" type="number" inputmode="decimal" min="1" max="20" step="0.1" label-placement="stacked" data-label="sRate"></ion-input></ion-item>
      </ion-list>
      <ion-list inset>
        <ion-item><ion-select id="s-lang" interface="action-sheet" label-placement="stacked" data-label="sLang"><ion-select-option value="en">English</ion-select-option><ion-select-option value="hi">हिंदी</ion-select-option></ion-select></ion-item>
      </ion-list>
      <p class="settings-note" id="settings-note"></p>
    </ion-content>
  </ion-modal>

  <!-- connecting a real inverter -->
  <ion-modal id="connect" initial-breakpoint="0.8" breakpoints="[0, 0.8, 1]">
    <div class="sheet" id="connect-body"></div>
  </ion-modal>

  <ion-toast id="toast" duration="1800" position="top"></ion-toast>
</ion-app>
</body>
</html>
