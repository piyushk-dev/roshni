AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Roshni - rooftop solar copilot for PM Surya Ghar households

Parameters:
  BedrockModelId:
    Type: String
    Default: global.amazon.nova-2-lite-v1:0
    Description: Vision model for bills and quotes; others in bill_reader.MODELS are tried only if this one is denied
  WhatsAppPhoneNumberId:
    Type: String
    Default: ""
    Description: Phone number ID from Meta's WhatsApp API Setup page
  GraphApiVersion:
    Type: String
    Default: v25.0

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    LoggingConfig:
      LogFormat: JSON

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [content-type]
      # The API is public, so cap what a flood of requests could cost; the routes that call Bedrock
      # or Amazon Location get tighter limits than the rest.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      RouteSettings:
        "POST /ask": {ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}
        "GET /places": {ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}
        "POST /panel": {ThrottlingBurstLimit: 6, ThrottlingRateLimit: 3}

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.handler.lambda_handler
      Environment:
        Variables:
          YIELD_TABLE: !Ref YieldCache
          KNOWLEDGE_TABLE: !Ref KnowledgeTable
          MARKET_TABLE: !Ref MarketTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketTable
        - DynamoDBCrudPolicy:
            TableName: !Ref YieldCache
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/*
            - Effect: Allow  # the assistant finds the places people name
              Action: [geo-places:Geocode]
              Resource: !Sub arn:aws:geo-places:${AWS::Region}::provider/default
      Events:
        Bill:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /bill, Method: POST}
        Quote:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /quote, Method: POST}
        Analyze:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /analyze, Method: POST}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /health, Method: GET}
        Privacy:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /privacy, Method: GET}
        Stats:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /stats, Method: GET}
        Journey:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /journey, Method: GET}
        StageTimes:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /stats/stages, Method: GET}
        Ask:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /ask, Method: POST}
        Facts:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /facts, Method: GET}
        FactConfirm:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/facts/{id}/confirm", Method: POST}
        FactReport:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/facts/{id}/report", Method: POST}
        Vendors:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /vendors, Method: GET}
        Schemes:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /schemes, Method: GET}
        Finance:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /finance/plan, Method: POST}
        Checklists:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /care/checklists, Method: GET}
        Care:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /care/check, Method: POST}
        CareBill:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /care/bill, Method: POST}
        CareSupport:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /care/support, Method: POST}
        CareDust:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /care/dust, Method: GET}
        Scam:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /scam-check, Method: POST}
        MarketCreate:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /market/requests, Method: POST}
        MarketView:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/market/requests/{id}", Method: GET}
        MarketChoose:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/market/requests/{id}/choose", Method: POST}
        MarketDelete:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/market/requests/{id}", Method: DELETE}
        MarketPreview:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /market/preview, Method: POST}
        Panel:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /panel, Method: POST}
        MarketOpen:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /market/open, Method: GET}
        Places:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /places, Method: GET}
        Plant:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /plant, Method: GET}
        MarketSubmit:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/market/requests/{id}/quotes", Method: POST}

  # Acknowledges Meta within milliseconds, then hands the message to the worker
  WhatsAppWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.wa_handler.webhook
      Timeout: 10
      Environment:
        Variables:
          SSM_PREFIX: /surya-saathi/whatsapp
          WORKER_FUNCTION: !Ref WhatsAppWorkerFunction
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: surya-saathi/whatsapp/*
        - LambdaInvokePolicy:
            FunctionName: !Ref WhatsAppWorkerFunction
      Events:
        Verify:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /whatsapp, Method: GET}
        Receive:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /whatsapp, Method: POST}
        Twilio:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /twilio, Method: POST}

  WhatsAppWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.wa_handler.worker
      Timeout: 90
      Environment:
        Variables:
          SITE_URL: !Sub https://main.${WebApp.DefaultDomain}
          SSM_PREFIX: /surya-saathi/whatsapp
          SESSION_TABLE: !Ref SessionTable
          YIELD_TABLE: !Ref YieldCache
          KNOWLEDGE_TABLE: !Ref KnowledgeTable
          MARKET_TABLE: !Ref MarketTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          WA_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          GRAPH_VERSION: !Ref GraphApiVersion
          JOURNEY_STATE_MACHINE: !Ref JourneyStateMachine
          VOICE_BUCKET: !Ref VoiceBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VoiceBucket
        - Statement:
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob, polly:SynthesizeSpeech]
              Resource: "*"
        - SSMParameterReadPolicy:
            ParameterName: surya-saathi/whatsapp/*
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref JourneyStateMachine
            - Effect: Allow
              Action: [states:SendTaskSuccess]
              Resource: "*"
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketTable
        - DynamoDBCrudPolicy:
            TableName: !Ref YieldCache
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/*
            - Effect: Allow  # the assistant finds the places people name
              Action: [geo-places:Geocode]
              Resource: !Sub arn:aws:geo-places:${AWS::Region}::provider/default

  WebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WhatsAppWebhookFunction}
      RetentionInDays: 14

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WhatsAppWorkerFunction}
      RetentionInDays: 14

  # Per-user language, location and last estimate, plus message ids for de-duplication
  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  AnalyzeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeFunction}
      RetentionInDays: 14

  # Sunlight per 0.1° grid cell, so PVGIS and NASA are called once per neighbourhood
  YieldCache:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}

  # Voice notes in and out; everything is deleted after a day
  VoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: delete-after-a-day
            Status: Enabled
            ExpirationInDays: 1

  # Application journey: one Step Functions execution per household, a task token per stage
  JourneyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.journey.task_handler
      Timeout: 30
      Environment:
        Variables:
          SSM_PREFIX: /surya-saathi/whatsapp
          SESSION_TABLE: !Ref SessionTable
          WA_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          GRAPH_VERSION: !Ref GraphApiVersion
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: surya-saathi/whatsapp/*
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable

  JourneyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JourneyFunction}
      RetentionInDays: 14

  JourneyStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/journey.asl.json
      DefinitionSubstitutions:
        JourneyFunctionArn: !GetAtt JourneyFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref JourneyFunction

  # Self-updating knowledge: tariffs learned from bills, prices from quotes, community-checked facts, counters
  MarketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  KnowledgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  # Weekly: re-read official sources and flag facts whose page changed
  WatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.knowledge.watch_handler
      Timeout: 120
      Environment:
        Variables:
          KNOWLEDGE_TABLE: !Ref KnowledgeTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeTable
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(7 days)

  WatcherLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WatcherFunction}
      RetentionInDays: 14

  # Map tiles for the website's roof tracer. The key is public by design: it can only fetch map
  # tiles and styles, and only from this site's addresses. deploy_web.py reads it into config.js.
  MapKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: surya-saathi-maps
      Description: Satellite map tiles for tracing a roof on the Surya Saathi website  # the old name stays: changing it needs ForceUpdate on a key in use, and no one sees it
      NoExpiry: true
      Restrictions:
        AllowActions: ["geo-maps:*"]
        AllowResources: [!Sub "arn:aws:geo-maps:${AWS::Region}::provider/default"]
        AllowReferers:
          - !Sub https://main.${WebApp.DefaultDomain}/*
          - http://localhost:8766/*
          - http://127.0.0.1:8766/*

  # Static site in web/, uploaded by scripts/deploy_web.py (manual deploys, no repo connection)
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: surya-saathi
      Platform: WEB

  WebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt WebApp.AppId
      BranchName: main
      Stage: PRODUCTION

Outputs:
  WebAppId:
    Value: !GetAtt WebApp.AppId
  WebUrl:
    Value: !Sub https://main.${WebApp.DefaultDomain}
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  MapKeyName:
    Value: !Ref MapKey
  WhatsAppCallbackUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/whatsapp
