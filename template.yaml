AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Surya Saathi - rooftop solar copilot for PM Surya Ghar households

Parameters:
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-5-5
    Description: Vision model for reading bills; falls back to Nova 2 Lite if access is denied

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    LoggingConfig:
      LogFormat: JSON

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: surya.handler.lambda_handler
      Environment:
        Variables:
          YIELD_TABLE: !Ref YieldCache
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YieldCache
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/*
      Events:
        Bill:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /bill, Method: POST}
        Analyze:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /analyze, Method: POST}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /health, Method: GET}

  AnalyzeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnalyzeFunction}
      RetentionInDays: 14

  # Sunlight per 0.1° grid cell, so PVGIS and NASA are called once per neighbourhood
  YieldCache:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
